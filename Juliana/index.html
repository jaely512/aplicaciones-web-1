<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Interactivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor principal -->
  <div class="contador-container">
    <!-- Etiqueta para mostrar el número -->
    <h1 id="numero">0</h1>

    <!-- Botones de acción -->
    <div class="botones">
      <button id="btn-disminuir">- Disminuir</button>
      <button id="btn-incrementar">+ Incrementar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
